<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle Atlas — 世界史クロニクルタイムライン</title>
  <meta name="description" content="世界の歴史をインタラクティブなタイムラインで横断的に体験するデータベース。">
  <style>
    :root {
      --bg: #0a0a10;
      --surface: #12121a;
      --surface-2: #1a1a24;
      --text: #e4e0d8;
      --text-dim: #908e88;
      --gold: #c4a55a;
      --gold-dim: rgba(196,165,90,.12);
      --border: rgba(196,165,90,.15);
      --border-subtle: rgba(255,255,255,.06);
      --font: 'Segoe UI','Hiragino Sans','Meiryo',sans-serif;
      --year-col: 64px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}

    /* ── Site Header ── */
    .site-header{text-align:center;padding:28px 20px 18px;background:linear-gradient(180deg,rgba(10,10,16,1) 0%,rgba(10,10,16,.95) 100%)}
    .banner-img{width:100%;max-width:540px;height:auto;border-radius:6px;filter:drop-shadow(0 2px 16px rgba(196,165,90,.18));animation:fadeIn .6s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .tagline{color:var(--text-dim);font-size:.92rem;margin-top:10px;letter-spacing:.3px}

    /* ── Navigation hint bar ── */
    .nav-hint{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border-subtle);font-size:.82rem;color:var(--text-dim);flex-wrap:wrap}
    .nav-hint .jump-btn{padding:4px 12px;border-radius:12px;background:var(--gold-dim);border:1px solid var(--border);color:var(--gold);cursor:pointer;font-size:.78rem;font-family:inherit;transition:all .2s;text-decoration:none}
    .nav-hint .jump-btn:hover{background:var(--gold);color:var(--bg)}
    .nav-hint .jump-btn.active-link{border-color:var(--gold);box-shadow:0 0 6px rgba(196,165,90,.3)}

    /* ── Timeline Wrapper ── */
    .wt-wrapper{position:relative;overflow-x:auto;overflow-y:visible}

    /* ── Sticky Region Headers ── */
    .wt-region-header{display:flex;position:sticky;top:0;z-index:50;background:rgba(10,10,16,.97);backdrop-filter:blur(8px);border-bottom:2px solid var(--border);min-width:max-content}
    .wt-year-label{width:var(--year-col);min-width:var(--year-col);padding:10px 6px;text-align:center;font-size:.78rem;color:var(--gold);font-weight:700;border-right:1px solid var(--border)}
    .wt-region-name{flex:1;min-width:180px;padding:10px 14px;font-weight:700;font-size:.95rem;color:var(--text);border-right:1px solid var(--border-subtle);display:flex;align-items:center;gap:6px}
    .wt-region-name .r-icon{font-size:1.1rem}
    .wt-region-name.placeholder{color:var(--text-dim);opacity:.45;font-style:italic}

    /* ── Timeline Grid ── */
    .wt-grid{display:flex;position:relative;min-width:max-content}

    /* Year column */
    .wt-year-col{width:var(--year-col);min-width:var(--year-col);position:sticky;left:0;z-index:20;background:var(--bg);border-right:1px solid var(--border);flex-shrink:0}
    .year-mark{position:absolute;right:8px;transform:translateY(-50%);font-size:.72rem;font-weight:600;white-space:nowrap}
    .year-mark.century{color:var(--gold)}
    .year-mark.half-century{color:var(--text-dim);font-weight:400;font-size:.65rem}

    /* Region columns */
    .wt-region-col{flex:1;min-width:180px;position:relative;border-right:1px solid var(--border-subtle)}

    /* Century grid lines */
    .grid-line{position:absolute;left:0;right:0;pointer-events:none;z-index:0}
    .grid-line.century{height:1px;background:rgba(196,165,90,.08)}
    .grid-line.half-century{height:1px;background:rgba(255,255,255,.025)}
    .grid-line.major{height:1px;background:rgba(196,165,90,.18)}

    /* ── Era Blocks ── */
    .era-block{
      position:absolute;left:22px;right:5px;
      border-radius:5px;
      display:flex;flex-direction:column;justify-content:center;align-items:center;
      overflow:hidden;cursor:default;
      transition:all .2s ease;
      z-index:2;
      border:1px solid rgba(255,255,255,.08);
      min-height:18px;
    }
    .era-block::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 40%,rgba(0,0,0,.15) 100%);
      pointer-events:none;border-radius:inherit;
    }
    .era-block:hover{
      filter:brightness(1.2);
      transform:scaleX(1.02);
      z-index:3;
      box-shadow:0 2px 12px rgba(0,0,0,.5);
    }
    .era-block.linked{
      cursor:pointer;
      border:1.5px solid var(--gold);
      box-shadow:0 0 12px rgba(196,165,90,.15);
      animation:linkedPulse 3s ease-in-out infinite;
      z-index:4;
    }
    .era-block.linked:hover{
      box-shadow:0 0 24px rgba(196,165,90,.35);
      transform:scaleX(1.04);
    }
    @keyframes linkedPulse{
      0%,100%{box-shadow:0 0 8px rgba(196,165,90,.15)}
      50%{box-shadow:0 0 18px rgba(196,165,90,.3)}
    }
    .era-block .era-name{
      font-weight:700;text-align:center;line-height:1.2;
      position:relative;z-index:1;
      text-shadow:0 1px 3px rgba(0,0,0,.5);
      padding:0 4px;
    }
    .era-block .era-years{
      font-size:.65rem;opacity:.7;margin-top:2px;
      position:relative;z-index:1;
      text-shadow:0 1px 2px rgba(0,0,0,.5);
    }
    .era-block .era-link-hint{
      font-size:.65rem;color:var(--gold);margin-top:4px;
      position:relative;z-index:1;
      opacity:.8;
    }
    /* Very short era blocks: vertical text */
    .era-block.compact .era-name{font-size:.7rem;writing-mode:vertical-rl;text-orientation:mixed;padding:2px 0}
    .era-block.compact .era-years{display:none}
    .era-block.compact .era-link-hint{display:none}
    /* Coming soon era blocks */
    .era-block.coming-soon{border:1.5px dashed rgba(255,255,255,.2);opacity:.65}
    .era-block.coming-soon:hover{opacity:.85}
    .era-block.coming-soon .era-badge{font-size:.6rem;margin-top:4px;padding:1px 8px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--text-dim);position:relative;z-index:1}

    /* ── Tooltip ── */
    .era-tooltip{
      position:fixed;z-index:100;
      background:rgba(18,18,26,.96);
      border:1px solid var(--border);
      border-radius:6px;padding:10px 14px;
      pointer-events:none;opacity:0;
      transition:opacity .15s;
      max-width:260px;
      box-shadow:0 8px 24px rgba(0,0,0,.5);
      font-size:.84rem;
    }
    .era-tooltip.visible{opacity:1}
    .era-tooltip .tt-name{font-weight:700;color:var(--gold);margin-bottom:2px}
    .era-tooltip .tt-years{color:var(--text-dim);font-size:.78rem}
    .era-tooltip .tt-note{margin-top:4px;color:var(--text);font-size:.8rem;line-height:1.45}

    /* ── Dynasty Background Blocks ── */
    .dynasty-block{
      position:absolute;left:0;right:0;
      z-index:1;
      border-top:1px solid rgba(255,255,255,.1);
      display:flex;
      align-items:flex-start;
      overflow:hidden;
      pointer-events:none;
    }
    .dynasty-name{
      writing-mode:vertical-rl;
      font-size:.68rem;
      color:rgba(255,255,255,.4);
      padding:6px 2px 4px 2px;
      letter-spacing:1px;
      white-space:nowrap;
      line-height:1;
      user-select:none;
    }
    .dynasty-block:hover .dynasty-name{color:rgba(255,255,255,.7)}

    /* ── Footer ── */
    .site-footer{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:.8rem;border-top:1px solid var(--border-subtle)}

    /* ── Mobile ── */
    @media(max-width:768px){
      .site-header{padding:16px 12px 12px}
      .banner-img{max-width:90%}
      .tagline{font-size:.84rem}
      .wt-region-name{min-width:140px;font-size:.85rem;padding:8px 10px}
      .wt-region-col{min-width:140px}
      .era-block{left:3px;right:3px}
      .era-block .era-name{font-size:.78rem}
    }
    @media(max-width:480px){
      :root{--year-col:50px}
      .banner-img{max-width:100%}
      .wt-region-name{min-width:120px;font-size:.8rem}
      .wt-region-col{min-width:120px}
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <img src="./Chronicle-atlas.png" alt="Chronicle Atlas" class="banner-img">
    <p class="tagline">世界の歴史を横断的に体験するインタラクティブ・タイムライン</p>
  </header>

  <!-- Navigation Hint -->
  <nav class="nav-hint" id="nav-hint">
    <span>📍 クイックジャンプ:</span>
    <!-- populated by JS -->
  </nav>

  <!-- World Timeline -->
  <div class="wt-wrapper">
    <div class="wt-region-header" id="wt-header"></div>
    <div class="wt-grid" id="wt-grid"></div>
  </div>

  <!-- Tooltip -->
  <div class="era-tooltip" id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-years"></div>
    <div class="tt-note"></div>
  </div>

  <footer class="site-footer">Chronicle Atlas © 2025 — 歴史の流れをひとつのキャンバスで</footer>

<script>
/* =========================================================================
   Chronicle Atlas — World Timeline Data & Renderer
   ========================================================================= */
(() => {
  // ── Configuration ──
  const START_YEAR = -800;
  const END_YEAR   = 1920;
  const PX_PER_YEAR = 3;
  const TOTAL_PX = (END_YEAR - START_YEAR) * PX_PER_YEAR;

  function yearToY(year) { return (year - START_YEAR) * PX_PER_YEAR; }
  function fmtYear(y) { return y < 0 ? `BC${-y}` : `${y}`; }
  function fmtYearJa(y) { return y < 0 ? `紀元前${-y}年` : `${y}年`; }

  // ── Regions ──
  const REGIONS = [
    { id: 'china',  name: '中国',       icon: '🐉' },
    { id: 'japan',  name: '日本',       icon: '⛩️' },
    { id: 'europe', name: 'ヨーロッパ',  icon: '🏛️' },
    { id: 'others', name: 'その他の地域', icon: '🌍', placeholder: true },
  ];

  // ── Era Data (sub-project targets only) ──
  const ERAS = [
    // ─── 中国 ───
    { region:'china', name:'戦国時代',  start:-475, end:-221, color:'#7a3545',
      note:'⚔️ 七雄が覇を競う合従連衡の時代。孫子・韓非子・屈原。秦の統一へ。',
      link:'./warring-states/', linked:true },
    { region:'china', name:'楚漢戦争',  start:-230, end:-202, color:'#8a4a2a',
      displayStart:-209, displayEnd:-202,
      note:'⚔️ 秦滅亡後の項羽vs劉邦。鴻門の会、四面楚歌、垓下の戦い。前漢成立へ。',
      link:'./chu-han/', linked:true },
    { region:'china', name:'三国時代',  start:220,  end:280,  color:'#b8963c',
      note:'⚔️ 魏・蜀・呉の三国が覇を競う。劉備・曹操・孫権の時代。',
      link:'./three-kingdoms/', linked:true },

    // ─── 日本 ───
    { region:'japan', name:'戦国時代',  start:1467, end:1615, color:'#5a6a2a',
      note:'⚔️ 応仁の乱から大坂の陣まで。信長・秀吉・家康の天下統一。',
      link:'./sengoku-japan/', linked:true },

    // ─── ヨーロッパ ───
    { region:'europe', name:'ローマ帝国', start:-27, end:476, color:'#5a2a5a',
      note:'パクス・ロマーナからゲルマン民族の大移動まで。西洋文明の礎。',
      comingSoon:true },
    { region:'europe', name:'大航海時代〜ルネサンス', start:1453, end:1648, color:'#3a4a6a',
      note:'コロンブスの新大陸発見。宗教改革。文芸復興の開花。',
      comingSoon:true },
  ];

  // ── Quick Jump targets ──
  const JUMPS = [
    { label: '戦国時代（中国）', year: -475 },
    { label: '楚漢戦争 ⚔️', year: -209 },
    { label: '三国時代 ⚔️', year: 180, highlight: true },
    { label: '戦国時代（日本）', year: 1467 },
  ];

  // ── Dynasty / State background data ──
  const DYNASTIES = [
    // ─── 中国 ───
    { region:'china', name:'春秋',    start:-770, end:-475, color:'rgba(90,53,53,.35)' },
    { region:'china', name:'戦国',    start:-475, end:-221, color:'rgba(106,53,69,.30)' },
    { region:'china', name:'秦',      start:-221, end:-206, color:'rgba(74,32,32,.50)' },
    { region:'china', name:'前漢',    start:-202, end:8,    color:'rgba(90,64,32,.35)' },
    { region:'china', name:'新',      start:8,    end:23,   color:'rgba(58,58,48,.40)' },
    { region:'china', name:'後漢',    start:25,   end:220,  color:'rgba(90,64,32,.30)' },
    { region:'china', name:'三国',    start:220,  end:280,  color:'rgba(74,58,32,.35)' },
    { region:'china', name:'西晋',    start:265,  end:316,  color:'rgba(58,74,74,.35)' },
    { region:'china', name:'東晋',    start:317,  end:420,  color:'rgba(58,74,74,.28)' },
    { region:'china', name:'南北朝',  start:420,  end:589,  color:'rgba(58,58,74,.30)' },
    { region:'china', name:'隋',      start:581,  end:618,  color:'rgba(74,58,58,.40)' },
    { region:'china', name:'唐',      start:618,  end:907,  color:'rgba(90,74,32,.30)' },
    { region:'china', name:'五代十国', start:907, end:960,  color:'rgba(58,58,58,.35)' },
    { region:'china', name:'宋',      start:960,  end:1279, color:'rgba(74,74,32,.28)' },
    { region:'china', name:'元',      start:1271, end:1368, color:'rgba(58,58,90,.30)' },
    { region:'china', name:'明',      start:1368, end:1644, color:'rgba(90,58,32,.28)' },
    { region:'china', name:'清',      start:1644, end:1912, color:'rgba(58,74,90,.28)' },
    // ─── 日本 ───
    { region:'japan', name:'弥生',    start:-300, end:250,  color:'rgba(58,74,58,.28)' },
    { region:'japan', name:'古墳',    start:250,  end:538,  color:'rgba(74,74,58,.28)' },
    { region:'japan', name:'飛鳥',    start:538,  end:710,  color:'rgba(74,58,74,.30)' },
    { region:'japan', name:'奈良',    start:710,  end:794,  color:'rgba(90,74,58,.32)' },
    { region:'japan', name:'平安',    start:794,  end:1185, color:'rgba(90,58,74,.25)' },
    { region:'japan', name:'鎌倉',    start:1185, end:1333, color:'rgba(58,74,74,.30)' },
    { region:'japan', name:'室町',    start:1336, end:1573, color:'rgba(74,74,58,.25)' },
    { region:'japan', name:'安土桃山', start:1573, end:1603, color:'rgba(90,74,42,.35)' },
    { region:'japan', name:'江戸',    start:1603, end:1868, color:'rgba(58,74,90,.25)' },
    { region:'japan', name:'明治',    start:1868, end:1912, color:'rgba(74,58,58,.32)' },
    // ─── ヨーロッパ ───
    { region:'europe', name:'古代ギリシア', start:-800, end:-146, color:'rgba(58,58,90,.28)' },
    { region:'europe', name:'ローマ共和政', start:-509, end:-27,  color:'rgba(74,58,58,.25)' },
    { region:'europe', name:'ローマ帝国',   start:-27,  end:476,  color:'rgba(90,42,58,.25)' },
    { region:'europe', name:'東ローマ',     start:395,  end:1453, color:'rgba(74,58,90,.20)' },
    { region:'europe', name:'中世',         start:476,  end:1453, color:'rgba(58,58,58,.22)' },
    { region:'europe', name:'ルネサンス〜近世', start:1453, end:1789, color:'rgba(58,74,74,.25)' },
    { region:'europe', name:'近代',         start:1789, end:1920, color:'rgba(74,74,58,.22)' },
  ];

  // ── Render ──
  const grid = document.getElementById('wt-grid');
  const header = document.getElementById('wt-header');
  const tooltip = document.getElementById('tooltip');
  const navHint = document.getElementById('nav-hint');

  function render() {
    grid.style.height = TOTAL_PX + 'px';
    renderHeader();
    renderYearColumn();
    renderRegionColumns();
    renderGridLines();
    renderNavHint();
  }

  function renderHeader() {
    // Year label
    const yl = el('div','wt-year-label','年代');
    header.appendChild(yl);
    // Region headers
    REGIONS.forEach(r => {
      const rn = el('div', 'wt-region-name' + (r.placeholder ? ' placeholder' : ''));
      rn.innerHTML = `<span class="r-icon">${r.icon}</span> ${r.name}`;
      header.appendChild(rn);
    });
  }

  function renderYearColumn() {
    const col = el('div','wt-year-col');
    col.style.height = TOTAL_PX + 'px';
    for (let y = START_YEAR; y <= END_YEAR; y += 50) {
      const mark = el('div', y % 100 === 0 ? 'year-mark century' : 'year-mark half-century');
      mark.style.top = yearToY(y) + 'px';
      mark.textContent = fmtYear(y);
      mark.id = 'y' + y;
      col.appendChild(mark);
    }
    grid.appendChild(col);
  }

  function renderRegionColumns() {
    REGIONS.forEach(r => {
      const col = el('div','wt-region-col');
      col.style.height = TOTAL_PX + 'px';
      col.dataset.region = r.id;

      if (r.placeholder) {
        // placeholder message
        const msg = el('div','');
        msg.style.cssText = 'position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:var(--text-dim);opacity:.3;font-size:.85rem;text-align:center;writing-mode:vertical-rl;letter-spacing:4px';
        msg.textContent = '準備中...';
        col.appendChild(msg);
      } else {
        // Render dynasty background blocks first
        const regionDynasties = DYNASTIES.filter(d => d.region === r.id);
        regionDynasties.forEach(dyn => {
          const dBlock = createDynastyBlock(dyn);
          col.appendChild(dBlock);
        });
        // Render era blocks on top
        const regionEras = ERAS.filter(e => e.region === r.id);
        regionEras.forEach(era => {
          const block = createEraBlock(era);
          col.appendChild(block);
        });
      }
      grid.appendChild(col);
    });
  }

  function createEraBlock(era) {
    const top = yearToY(era.start);
    const height = (era.end - era.start) * PX_PER_YEAR;
    const isCompact = height < 55;

    const block = el('div', 'era-block' + (isCompact ? ' compact' : '') + (era.linked ? ' linked' : '') + (era.comingSoon ? ' coming-soon' : ''));
    block.style.top = top + 'px';
    block.style.height = height + 'px';
    block.style.background = era.color;

    // Era name
    const name = el('div','era-name', era.name);
    // Adjust font size based on block height
    if (height < 40) {
      name.style.fontSize = '.65rem';
    } else if (height < 80) {
      name.style.fontSize = '.78rem';
    } else if (height > 200) {
      name.style.fontSize = '1rem';
    } else {
      name.style.fontSize = '.88rem';
    }
    block.appendChild(name);

    // Year range (only if not compact) — use displayStart/displayEnd if available
    if (!isCompact) {
      const ds = era.displayStart ?? era.start;
      const de = era.displayEnd ?? era.end;
      const years = el('div','era-years', `${fmtYear(ds)} — ${fmtYear(de)}`);
      block.appendChild(years);
    }

    // Link hint for linked eras
    if (era.linked && !isCompact) {
      const hint = el('div','era-link-hint','▶ 詳細タイムラインを見る');
      block.appendChild(hint);
    }
    // Coming soon badge
    if (era.comingSoon && !isCompact) {
      const badge = el('div','era-badge','準備中');
      block.appendChild(badge);
    }

    // Tooltip on hover
    block.addEventListener('mouseenter', (e) => showTooltip(e, era));
    block.addEventListener('mousemove', (e) => moveTooltip(e));
    block.addEventListener('mouseleave', hideTooltip);

    // Click to navigate
    if (era.link) {
      block.addEventListener('click', () => { window.location.href = era.link; });
    }

    return block;
  }

  function createDynastyBlock(dyn) {
    const clampedStart = Math.max(dyn.start, START_YEAR);
    const clampedEnd = Math.min(dyn.end, END_YEAR);
    const top = yearToY(clampedStart);
    const height = (clampedEnd - clampedStart) * PX_PER_YEAR;

    const block = el('div','dynasty-block');
    block.style.top = top + 'px';
    block.style.height = Math.max(height, 12) + 'px';
    block.style.background = dyn.color;

    const label = el('div','dynasty-name', dyn.name);
    // Adjust font size for very short periods
    if (height < 40) {
      label.style.fontSize = '.55rem';
      label.style.padding = '2px 1px';
    } else if (height < 80) {
      label.style.fontSize = '.62rem';
    }
    block.appendChild(label);
    return block;
  }

  function renderGridLines() {
    // Create a container for grid lines that spans all region columns
    const lines = el('div','');
    lines.style.cssText = `position:absolute;top:0;left:var(--year-col);right:0;height:${TOTAL_PX}px;pointer-events:none;z-index:0`;

    for (let y = START_YEAR; y <= END_YEAR; y += 50) {
      const line = el('div', y % 500 === 0 ? 'grid-line major' : (y % 100 === 0 ? 'grid-line century' : 'grid-line half-century'));
      line.style.top = yearToY(y) + 'px';
      lines.appendChild(line);
    }
    grid.appendChild(lines);
  }

  function renderNavHint() {
    JUMPS.forEach(j => {
      const btn = el('button', 'jump-btn' + (j.highlight ? ' active-link' : ''), j.label);
      btn.addEventListener('click', () => {
        // Calculate the pixel position of this year in the grid
        const gridTop = grid.getBoundingClientRect().top + window.scrollY;
        const targetY = gridTop + yearToY(j.year) - 50; // 50px offset for sticky header
        window.scrollTo({ top: targetY, behavior: 'smooth' });
      });
      navHint.appendChild(btn);
    });
  }

  // ── Tooltip ──
  function showTooltip(e, era) {
    const ds = era.displayStart ?? era.start;
    const de = era.displayEnd ?? era.end;
    tooltip.querySelector('.tt-name').textContent = era.name;
    tooltip.querySelector('.tt-years').textContent =
      `${fmtYearJa(ds)} 〜 ${fmtYearJa(de)}（${de - ds}年間）`;
    tooltip.querySelector('.tt-note').textContent = era.note || '';
    tooltip.classList.add('visible');
    moveTooltip(e);
  }
  function moveTooltip(e) {
    const pad = 14;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + 270 > window.innerWidth) x = e.clientX - 270;
    if (y + 120 > window.innerHeight) y = e.clientY - 120;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('visible'); }

  // ── Helpers ──
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  render();
})();
</script>
</body>
</html>
