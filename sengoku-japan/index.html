<!DOCTYPE html>
<html lang="ja">
<head>

  <link rel="stylesheet" href="styles.css?v=1.0">
</head>
<body>

  <!-- Sticky Header -->
  <header class="sticky-header">
    <div class="header-row">
      <a href="../" class="back-to-atlas">竊・Atlas</a>
      <h1>笵ｩ・・譌･譛ｬ縺ｮ謌ｦ蝗ｽ譎ゆｻ｣<span>1467蟷ｴ縲・615蟷ｴ</span></h1>
      <div class="header-actions">
        <button class="btn" id="btn-toggle-sidebar" title="莠ｺ迚ｩ荳隕ｧ">則 莠ｺ迚ｩ荳隕ｧ</button>
        <button class="btn" id="btn-toggle-map" title="蜍｢蜉帛峙繧定｡ｨ遉ｺ">亮・・蜍｢蜉帛峙</button>
      </div>
    </div>
    <!-- Era Navigation -->
    <nav class="era-nav" id="era-nav"></nav>
    <!-- Filters + Search -->
    <div class="controls-row">
      <div id="faction-filters"></div>
      <div id="category-filters"></div>
      <div class="search-box"><input type="text" id="search" placeholder="剥 蜃ｺ譚･莠九・莠ｺ迚ｩ繧呈､懃ｴ｢窶ｦ"></div>
    </div>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>
    <!-- Content Area -->
    <div class="content-area">
      <!-- Timeline -->
      <div class="timeline-column">
        <div class="timeline" id="timeline"></div>
      </div>
      <!-- Map Column (hidden by default) -->
      <div class="map-column" id="map-column" style="display:none">
        <div class="map-panel">
          <div class="map-title">寮 蜍｢蜉帛峙 <span class="map-year-badge" id="map-year-badge"></span></div>
          <div class="map-container">
            <div class="map-grid" id="map-grid"></div>
            <div class="map-legend" id="map-legend"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Event Detail Modal -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="em-title"></h2>
          <div class="sub"><span id="em-year"></span> 窶・<span id="em-location"></span></div>
        </div>
        <div class="modal-head-actions">
          <span id="em-wiki-link"></span>
          <button class="modal-close" id="em-close">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-section"><h3>当 蜿ｲ螳溘・險倬鹸</h3><p id="em-desc"></p></div>
        <div class="modal-section" id="em-trivia-section"><h3>糖 陬懆ｶｳ繝ｻ雎・衍隴・/h3><div class="trivia-box"><p id="em-trivia"></p></div></div>
        <div class="modal-section"><h3>則 髢｢騾｣莠ｺ迚ｩ・医け繝ｪ繝・け縺ｧ隧ｳ邏ｰ・・/h3><div id="em-chars" class="event-chars"></div></div>
      </div>
    </div>
  </div>

  <!-- Character Detail Modal -->
  <div class="modal-overlay" id="char-modal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="cm-name"></h2>
          <div class="sub char-header-info">
            <span id="cm-faction-tag" class="tag"></span>
            <span id="cm-role"></span>
            <span class="char-life" id="cm-life"></span>
          </div>
          <div class="reading-line" id="cm-reading"></div>
        </div>
        <div class="modal-head-actions">
          <span id="cm-wiki-link"></span>
          <button class="modal-close" id="cm-close">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-section"><h3>当 莠ｺ迚ｩ莨・/h3><p id="cm-desc"></p></div>
        <div class="modal-section" id="cm-trivia-section"><h3>糖 陬懆ｶｳ繝ｻ雎・衍隴・/h3><div class="trivia-box"><p id="cm-trivia"></p></div></div>
        <div class="modal-section"><h3>套 髢｢騾｣縺吶ｋ蜃ｺ譚･莠具ｼ医け繝ｪ繝・け縺ｧ隧ｳ邏ｰ・・/h3><div id="cm-events" class="char-events-grid"></div></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=1.1"></script>
</body>
</html>
