<body>

  <!-- Sticky Header -->

        <button class="filter-btn" data-cat="episode">鹿 騾ｸ隧ｱ</button>
      </div>
      <div class="search-box">

  <!-- Main Layout -->

    <!-- Content: Timeline + Map side by side -->
    <div class="content-area" id="content-area">
      <!-- Timeline (scrollable) -->
      <div class="timeline-column">
        <div class="timeline" id="timeline"></div>
      </div>
      <!-- Territory Map (sticky right panel) -->
      <div class="map-column" id="map-column" style="display:none">

          <div class="map-title">亮・・蜍｢蜉帛峙 窶・<span id="map-era-label">蜈ｨ譎ゆｻ｣</span></div>
          <div class="map-container">
            <div class="map-grid" id="map-grid"></div>
            <div class="map-legend" id="map-legend"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Event Detail Modal -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="em-title"></h2>
          <div class="sub"><span id="em-year"></span> 窶・<span id="em-location"></span></div>
        </div>
        <div class="modal-head-actions">
          <span id="em-wiki-link"></span>
          <button class="modal-close" id="em-close">&times;</button>

        <div class="modal-section" id="em-trivia-section"><h3>糖 陬懆ｶｳ繝ｻ雎・衍隴・/h3><div class="trivia-box"><p id="em-trivia"></p></div></div>
        <div class="modal-section"><h3>則 髢｢騾｣莠ｺ迚ｩ・医け繝ｪ繝・け縺ｧ隧ｳ邏ｰ・・/h3><div id="em-chars" class="event-chars"></div></div>

    </div>

  <!-- Character Detail Modal -->

    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="cm-name"></h2>
          <div class="sub char-header-info">

      </div>

  <script src="app.js?v=1.2"></script>
